name: minimal release Build Flutter APK (Ultra Optimized)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Clean project
        run: flutter clean

      - name: Build APK
        run: |
          flutter build apk --release \
          --split-per-abi \
          --tree-shake-icons \
          --obfuscate \
          --split-debug-info=build/debug-info \
          --dart-define=API_BASE_URL=https://android-al-ahmadi-store-api.onrender.com/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: optimized-release-apks
          path: build/app/outputs/flutter-apk/*.apk
