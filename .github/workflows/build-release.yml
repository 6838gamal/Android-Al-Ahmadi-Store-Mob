name: Build Flutter APK (Optimized)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # تحميل المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # Java للأندرويد
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Flutter Stable
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # تثبيت الحزم
      - name: Install dependencies
        run: flutter pub get

      # تنظيف
      - name: Clean project
        run: flutter clean

      # بناء APK خفيف ومحسن
      - name: Build optimized APK
        run: |
          flutter build apk --release \
          --split-per-abi \
          --obfuscate \
          --split-debug-info=build/debug-info \
          --dart-define=API_BASE_URL=https://ahl-al-hadith-wa-al-athar-center-mob.onrender.com

      # رفع ملفات APK
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: optimized-release-apks
          path: build/app/outputs/flutter-apk/*.apk
