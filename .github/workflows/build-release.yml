name: Build Flutter APK (Ultra Optimized)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # تحميل المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # إعداد Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # إعداد Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # تثبيت الحزم
      - name: Install dependencies
        run: flutter pub get

      # تنظيف المشروع
      - name: Clean project
        run: flutter clean

      # بناء APK محسن وخفيف
      - name: Build APK
        run: |
          flutter build apk --release \
          --split-per-abi \
          --tree-shake-icons \
          --obfuscate \
          --split-debug-info=build/debug-info \
          --dart-define=API_BASE_URL=https://android-al-ahmadi-store-api.onrender.com/

      # رفع ملفات APK
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: optimized-release-apks
          path: build/app/outputs/flutter-apk/*.apk

      # رفع ملفات debug symbols
      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/debug-info
