{% extends "layout.html" %}
{% block title %}صفقة جديدة{% endblock %}
{% block page_title %}إنشاء صفقة سرية{% endblock %}
{% block page_title_mobile %}صفقة جديدة{% endblock %}

{% block content %}
<div style="margin-bottom:16px">
  <a href="/secret-deals" style="color:#9CA3AF;font-size:13px;font-weight:600;text-decoration:none"><i class="fa-solid fa-arrow-right"></i> العودة للصفقات</a>
</div>

<div class="card" style="max-width:560px;margin:auto;padding:28px">
  <h3 style="color:white;font-weight:800;margin:0 0 20px">🔐 صفقة سرية جديدة</h3>
  <form method="POST" action="/secret-deals/add">
    <div style="margin-bottom:14px">
      <label style="color:#9CA3AF;font-size:13px;font-weight:600;display:block;margin-bottom:6px">عنوان الصفقة *</label>
      <input name="title" type="text" class="input-field" required placeholder="مثال: شاشات سامسونج A باتش جديد">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
      <div>
        <label style="color:#9CA3AF;font-size:13px;font-weight:600;display:block;margin-bottom:6px">اسم المورد</label>
        <input name="supplier_name" type="text" class="input-field" placeholder="اسم المورد">
      </div>
      <div>
        <label style="color:#9CA3AF;font-size:13px;font-weight:600;display:block;margin-bottom:6px">هاتف المورد</label>
        <input name="supplier_phone" type="text" class="input-field" placeholder="07xxxxxxxx">
      </div>
      <div>
        <label style="color:#9CA3AF;font-size:13px;font-weight:600;display:block;margin-bottom:6px">سعر الوحدة (ريال)</label>
        <input name="price_per_unit" type="number" step="0.01" class="input-field" placeholder="0">
      </div>
      <div>
        <label style="color:#9CA3AF;font-size:13px;font-weight:600;display:block;margin-bottom:6px">الإجمالي (ريال)</label>
        <input name="total_price" type="number" step="0.01" class="input-field" placeholder="0">
      </div>
    </div>
    <div style="margin-bottom:14px">
      <label style="color:#9CA3AF;font-size:13px;font-weight:600;display:block;margin-bottom:6px">ملاحظات خاصة</label>
      <textarea name="admin_notes" class="input-field" rows="3" placeholder="ملاحظات سرية..."></textarea>
    </div>
    <div style="display:flex;gap:10px">
      <button type="submit" class="btn-primary" style="flex:1;justify-content:center"><i class="fa-solid fa-plus"></i> إنشاء الصفقة</button>
      <a href="/secret-deals" class="btn-secondary">إلغاء</a>
    </div>
  </form>
</div>
{% endblock %}
