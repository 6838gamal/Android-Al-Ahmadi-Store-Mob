<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}لوحة إدارة اندرويد الاحمدي{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { cairo: ['Cairo', 'sans-serif'] },
          colors: {
            dark: { bg: '#0D1117', surface: '#161B22', card: '#1C2230', border: '#2D3748', alt: '#1A2035' },
            primary: { DEFAULT: '#1A73E8', hover: '#1557B0', light: 'rgba(26,115,232,0.15)' },
            success: '#22C55E', warning: '#F59E0B', danger: '#EF4444', info: '#06B6D4',
          }
        }
      }
    }
  </script>
  <style>
    * { font-family: 'Cairo', sans-serif; }
    body { background-color: #0D1117; color: #E5E7EB; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #161B22; } ::-webkit-scrollbar-thumb { background: #2D3748; border-radius: 3px; }
    .sidebar-link { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 10px; color: #9CA3AF; transition: all .2s; font-weight: 600; font-size: 14px; }
    .sidebar-link:hover, .sidebar-link.active { background: rgba(26,115,232,0.15); color: #1A73E8; }
    .sidebar-link i { width: 20px; text-align: center; }
    .stat-card { background: #1C2230; border: 1px solid #2D3748; border-radius: 16px; padding: 20px; }
    .btn-primary { background: #1A73E8; color: white; padding: 8px 20px; border-radius: 10px; font-weight: 700; font-size: 14px; transition: background .2s; display: inline-flex; align-items: center; gap: 8px; }
    .btn-primary:hover { background: #1557B0; }
    .btn-danger { background: rgba(239,68,68,0.15); color: #EF4444; padding: 6px 14px; border-radius: 8px; font-weight: 700; font-size: 13px; transition: all .2s; }
    .btn-danger:hover { background: #EF4444; color: white; }
    .btn-secondary { background: #1C2230; border: 1px solid #2D3748; color: #9CA3AF; padding: 8px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; transition: all .2s; display: inline-flex; align-items: center; gap: 8px; }
    .btn-secondary:hover { border-color: #1A73E8; color: #1A73E8; }
    .input-field { background: #1C2230; border: 1px solid #2D3748; color: #E5E7EB; padding: 10px 14px; border-radius: 10px; width: 100%; font-size: 14px; transition: border .2s; outline: none; }
    .input-field:focus { border-color: #1A73E8; }
    .select-field { background: #1C2230; border: 1px solid #2D3748; color: #E5E7EB; padding: 10px 14px; border-radius: 10px; font-size: 14px; outline: none; }
    .select-field:focus { border-color: #1A73E8; }
    .table-row { border-bottom: 1px solid #2D3748; transition: background .15s; }
    .table-row:hover { background: rgba(26,115,232,0.05); }
    .badge { padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
    .card { background: #1C2230; border: 1px solid #2D3748; border-radius: 14px; }
    .page-header { background: linear-gradient(135deg, #7B1FA2, #1A73E8); padding: 20px 24px; border-radius: 16px; margin-bottom: 24px; }
    #sidebar { transition: transform .3s; }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 40; }
  </style>
</head>
<body class="min-h-screen">
  <div class="flex h-screen overflow-hidden">
    <!-- Overlay for mobile -->
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 flex-shrink-0 bg-dark-surface border-l border-dark-border flex flex-col z-50 fixed h-full md:relative md:translate-x-0 translate-x-full" style="right:0">
      <!-- Logo -->
      <div class="p-5 border-b border-dark-border">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background: linear-gradient(135deg,#7B1FA2,#1A73E8)">
            <i class="fa-solid fa-mobile-screen text-white text-lg"></i>
          </div>
          <div>
            <div class="text-white font-extrabold text-sm leading-tight">اندرويد الاحمدي</div>
            <div class="text-xs text-gray-500">لوحة التحكم</div>
          </div>
        </div>
      </div>

      <!-- Nav -->
      <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
        <a href="/dashboard" class="sidebar-link {% if active == 'dashboard' %}active{% endif %}">
          <i class="fa-solid fa-chart-pie"></i> لوحة التحكم
        </a>
        <a href="/products" class="sidebar-link {% if active == 'products' %}active{% endif %}">
          <i class="fa-solid fa-box-open"></i> المنتجات
        </a>
        <a href="/orders" class="sidebar-link {% if active == 'orders' %}active{% endif %}">
          <i class="fa-solid fa-receipt"></i> الطلبات
        </a>
        <a href="/maintenance" class="sidebar-link {% if active == 'maintenance' %}active{% endif %}">
          <i class="fa-solid fa-screwdriver-wrench"></i> الصيانة
        </a>
        <a href="/reservations" class="sidebar-link {% if active == 'reservations' %}active{% endif %}">
          <i class="fa-solid fa-calendar-check"></i> الحجوزات
        </a>
        <a href="/customers" class="sidebar-link {% if active == 'customers' %}active{% endif %}">
          <i class="fa-solid fa-users"></i> العملاء
        </a>
      </nav>

      <!-- Admin info + logout -->
      <div class="p-4 border-t border-dark-border">
        <div class="flex items-center gap-3 mb-3">
          <div class="w-9 h-9 rounded-full bg-primary-light flex items-center justify-center">
            <i class="fa-solid fa-user text-primary text-sm"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-white text-sm font-bold truncate">{{ admin_name }}</div>
            <div class="text-gray-500 text-xs">مدير النظام</div>
          </div>
        </div>
        <a href="/logout" class="btn-danger w-full text-center text-xs justify-center">
          <i class="fa-solid fa-right-from-bracket me-1"></i> تسجيل الخروج
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-h-0 overflow-hidden">
      <!-- Top bar (mobile) -->
      <header class="md:hidden bg-dark-surface border-b border-dark-border px-4 py-3 flex items-center gap-3">
        <button onclick="openSidebar()" class="text-gray-400 hover:text-white">
          <i class="fa-solid fa-bars text-xl"></i>
        </button>
        <div class="text-white font-bold">{% block page_title %}{% endblock %}</div>
      </header>

      <!-- Scrollable content -->
      <main class="flex-1 overflow-y-auto p-4 md:p-6">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script>
    function openSidebar() {
      document.getElementById('sidebar').style.transform = 'translateX(0)';
      document.getElementById('overlay').style.display = 'block';
    }
    function closeSidebar() {
      document.getElementById('sidebar').style.transform = 'translateX(100%)';
      document.getElementById('overlay').style.display = 'none';
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
