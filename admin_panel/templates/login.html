<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — أندرويد الأحمدي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="/static/tw/tailwind.min.js"></script>
  <style>
    * { font-family: 'Cairo', sans-serif; }
    body { background: #0D1117; }

    .spin {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: #7B1FA2;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status-dot { transition: background .3s; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl mb-4"
           style="background: linear-gradient(135deg,#7B1FA2,#1A73E8)">
        <i class="fa-solid fa-mobile-screen text-white text-4xl"></i>
      </div>
      <h1 class="text-white text-2xl font-extrabold">أندرويد الأحمدي</h1>
      <p class="text-gray-500 text-sm mt-1">شاشات وصيانة الهواتف — لوحة الإدارة</p>
    </div>

    <!-- نموذج الدخول (يظهر فوراً) -->
    <div class="bg-[#161B22] border border-[#2D3748] rounded-2xl p-8">

      <!-- حالة الخادم (شارة صغيرة غير معيقة) -->
      <div id="server-badge" class="flex items-center gap-2 mb-5 text-xs text-gray-500">
        <span class="spin"></span>
        <span id="server-label">جاري التحقق من الخادم…</span>
      </div>

      <h2 class="text-white text-xl font-bold mb-6 text-center">تسجيل الدخول</h2>

      {% if error %}
      <div class="bg-red-500/10 border border-red-500/30 text-red-400 rounded-xl p-4 mb-6 flex items-center gap-3">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span class="text-sm font-semibold">{{ error }}</span>
      </div>
      {% endif %}

      <form method="post" action="/login" class="space-y-5">
        <div>
          <label class="text-gray-400 text-sm font-semibold mb-2 block">البريد الإلكتروني أو رقم الجوال</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute top-1/2 -translate-y-1/2 right-4 text-gray-500"></i>
            <input type="text" name="identifier" placeholder="admin@alahmadi.com" required autofocus
              class="w-full bg-[#1C2230] border border-[#2D3748] text-white placeholder-gray-600 rounded-xl py-3 px-4 pr-11 text-sm outline-none focus:border-blue-500 transition">
          </div>
        </div>
        <div>
          <label class="text-gray-400 text-sm font-semibold mb-2 block">كلمة المرور</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute top-1/2 -translate-y-1/2 right-4 text-gray-500"></i>
            <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password"
              class="w-full bg-[#1C2230] border border-[#2D3748] text-white placeholder-gray-600 rounded-xl py-3 px-4 pr-11 text-sm outline-none focus:border-blue-500 transition">
          </div>
        </div>
        <button type="submit"
          class="w-full py-3 rounded-xl text-white font-bold text-base transition hover:opacity-90 active:scale-95"
          style="background: linear-gradient(135deg,#7B1FA2,#1A73E8)">
          <i class="fa-solid fa-right-to-bracket me-2"></i>دخول
        </button>
      </form>
    </div>

    <p class="text-center text-gray-600 text-xs mt-6">نظام إدارة محل الجوالات &copy; 2026</p>
  </div>

  <script>
  (function(){
    const BASE  = location.pathname.startsWith('/admin-panel') ? '/admin-panel' : '';
    const badge = document.getElementById('server-badge');
    const label = document.getElementById('server-label');

    // نقطة الحالة (نُنشئها مرة واحدة وتبقى)
    const dot = document.createElement('span');
    dot.style.cssText = 'width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;transition:background .4s';
    dot.style.background = '#6b7280';

    let attempt = 0;
    let timer   = null;
    let lastOk  = false;

    function setChecking() {
      attempt++;
      const spin = badge.querySelector('.spin');
      if (spin) {
        spin.replaceWith(dot);
      }
      dot.style.background = '#6b7280';
      if (attempt === 1) {
        label.textContent = 'جاري التحقق من الخادم…';
        label.style.color = '#9ca3af';
      } else {
        label.textContent = 'يستيقظ الخادم… المحاولة ' + attempt + ' (قد يصل إلى 30 ثانية)';
        label.style.color = '#9ca3af';
      }
    }

    function setOnline(ms) {
      dot.style.background = '#22c55e';
      const sec = ms > 1000 ? ' (' + (ms/1000).toFixed(1) + 's)' : '';
      label.textContent = 'الخادم متصل' + sec;
      label.style.color = '#4ade80';
      lastOk = true;
    }

    function setSlow(ms) {
      dot.style.background = '#f59e0b';
      label.textContent = 'الخادم بطيء — استجابة ' + (ms/1000).toFixed(1) + 's';
      label.style.color = '#fbbf24';
      lastOk = true;
    }

    function setOffline() {
      if (lastOk) {
        // كان متصلاً ثم انقطع
        dot.style.background = '#ef4444';
        label.textContent = 'انقطع الاتصال — يُعاد تلقائياً…';
        label.style.color = '#f87171';
      } else {
        // لم يتصل أصلاً بعد → على الأرجح cold start
        dot.style.background = '#f59e0b';
        label.textContent = 'الخادم يستيقظ… يُرجى الانتظار (المحاولة ' + attempt + ')';
        label.style.color = '#fbbf24';
      }
    }

    async function check() {
      setChecking();
      const t0   = Date.now();
      const ctrl = new AbortController();
      const tid  = setTimeout(() => ctrl.abort(), 20000); // 20 ثانية timeout
      try {
        const res  = await fetch(BASE + '/api-status', { cache: 'no-store', signal: ctrl.signal });
        clearTimeout(tid);
        const ms   = Date.now() - t0;
        const data = await res.json();
        if (data.ok) {
          ms > 4000 ? setSlow(ms) : setOnline(ms);
        } else {
          setSlow(ms);
        }
      } catch (_) {
        clearTimeout(tid);
        setOffline();
      }
      // جدولة المحاولة القادمة
      const nextDelay = lastOk ? 10000 : 8000; // 10s متصل، 8s غير متصل
      timer = setTimeout(check, nextDelay);
    }

    // ابدأ فوراً
    check();
  })();
  </script>
</body>
</html>
