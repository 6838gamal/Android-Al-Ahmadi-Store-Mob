<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — أندرويد الأحمدي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'Cairo', sans-serif; }
    body { background: #0D1117; }

    /* Spinner */
    .spinner {
      width: 52px; height: 52px;
      border: 4px solid rgba(255,255,255,0.08);
      border-top-color: #7B1FA2;
      border-right-color: #1A73E8;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Dot pulse */
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #4B5563; animation: pulse 1.4s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes pulse { 0%,80%,100% { transform:scale(.8); background:#4B5563; } 40% { transform:scale(1.2); background:#7B1FA2; } }

    /* Fade transitions */
    #connect-screen, #login-screen { transition: opacity .4s ease; }
    .hidden-fade { opacity: 0; pointer-events: none; position: absolute; top: 0; left: 0; width: 100%; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md relative">

    <!-- Logo (shared) -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl mb-4"
           style="background: linear-gradient(135deg,#7B1FA2,#1A73E8)">
        <i class="fa-solid fa-mobile-screen text-white text-4xl"></i>
      </div>
      <h1 class="text-white text-2xl font-extrabold">أندرويد الأحمدي</h1>
      <p class="text-gray-500 text-sm mt-1">شاشات وصيانة الهواتف — لوحة الإدارة</p>
    </div>

    <!-- ── شاشة الاتصال ── -->
    <div id="connect-screen" class="bg-[#161B22] border border-[#2D3748] rounded-2xl p-8">

      <!-- حالة: جاري الاتصال -->
      <div id="state-connecting" class="flex flex-col items-center gap-5 py-4">
        <div class="spinner"></div>
        <p class="text-white font-bold text-lg">جاري الاتصال بالخادم…</p>
        <p class="text-gray-500 text-sm text-center">نتحقق من الاتصال قبل فتح صفحة الدخول</p>
        <div class="flex gap-2 mt-1">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
      </div>

      <!-- حالة: فشل الاتصال -->
      <div id="state-failed" class="hidden flex-col items-center gap-5 py-4">
        <div class="w-14 h-14 rounded-full bg-red-500/10 flex items-center justify-center">
          <i class="fa-solid fa-triangle-exclamation text-red-400 text-2xl"></i>
        </div>
        <p class="text-white font-bold text-lg">تعذّر الاتصال بالخادم</p>
        <p id="fail-reason" class="text-gray-500 text-sm text-center">
          الخادم لا يستجيب، قد يكون في وضع الاستعداد
        </p>
        <button onclick="startCheck()"
          class="mt-2 px-6 py-3 rounded-xl text-white font-bold text-sm transition hover:opacity-90 active:scale-95 flex items-center gap-2"
          style="background: linear-gradient(135deg,#7B1FA2,#1A73E8)">
          <i class="fa-solid fa-rotate-right"></i> إعادة المحاولة
        </button>
        <button onclick="showLogin()"
          class="text-gray-500 text-xs underline hover:text-gray-300 transition">
          الدخول على أي حال
        </button>
      </div>

    </div>

    <!-- ── شاشة تسجيل الدخول ── -->
    <div id="login-screen" class="hidden-fade">
      <div class="bg-[#161B22] border border-[#2D3748] rounded-2xl p-8">
        <h2 class="text-white text-xl font-bold mb-6 text-center">تسجيل الدخول</h2>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/30 text-red-400 rounded-xl p-4 mb-6 flex items-center gap-3">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span class="text-sm font-semibold">{{ error }}</span>
        </div>
        {% endif %}

        <form method="post" action="/login" class="space-y-5">
          <div>
            <label class="text-gray-400 text-sm font-semibold mb-2 block">البريد الإلكتروني أو رقم الجوال</label>
            <div class="relative">
              <i class="fa-solid fa-user absolute top-1/2 -translate-y-1/2 right-4 text-gray-500"></i>
              <input type="text" name="identifier" placeholder="admin@alahmadi.com" required
                class="w-full bg-[#1C2230] border border-[#2D3748] text-white placeholder-gray-600 rounded-xl py-3 px-4 pr-11 text-sm outline-none focus:border-blue-500 transition">
            </div>
          </div>
          <div>
            <label class="text-gray-400 text-sm font-semibold mb-2 block">كلمة المرور</label>
            <div class="relative">
              <i class="fa-solid fa-lock absolute top-1/2 -translate-y-1/2 right-4 text-gray-500"></i>
              <input type="password" name="password" placeholder="••••••••" required
                class="w-full bg-[#1C2230] border border-[#2D3748] text-white placeholder-gray-600 rounded-xl py-3 px-4 pr-11 text-sm outline-none focus:border-blue-500 transition">
            </div>
          </div>
          <button type="submit"
            class="w-full py-3 rounded-xl text-white font-bold text-base transition hover:opacity-90 active:scale-95"
            style="background: linear-gradient(135deg,#7B1FA2,#1A73E8)">
            <i class="fa-solid fa-right-to-bracket me-2"></i>دخول
          </button>
        </form>
      </div>
      <p class="text-center text-gray-600 text-xs mt-6">نظام إدارة محل الجوالات &copy; 2026</p>
    </div>

  </div>

  <script>
    // Resolve the correct /api-status URL whether we're under /admin-panel prefix or not
    const _base = location.pathname.startsWith('/admin-panel') ? '/admin-panel' : '';
    const STATUS_URL = _base + '/api-status';

    function showLogin() {
      const cs = document.getElementById('connect-screen');
      const ls = document.getElementById('login-screen');
      cs.style.opacity = '0';
      cs.style.pointerEvents = 'none';
      setTimeout(() => {
        cs.style.display = 'none';
        ls.classList.remove('hidden-fade');
        ls.style.opacity = '0';
        ls.style.position = 'relative';
        requestAnimationFrame(() => { ls.style.opacity = '1'; });
      }, 350);
    }

    function setState(name) {
      ['connecting', 'failed'].forEach(s => {
        const el = document.getElementById('state-' + s);
        if (s === name) {
          el.classList.remove('hidden');
          el.style.display = 'flex';
        } else {
          el.classList.add('hidden');
          el.style.display = 'none';
        }
      });
    }

    async function startCheck() {
      setState('connecting');
      try {
        const res  = await fetch(STATUS_URL, { cache: 'no-store' });
        const data = await res.json();
        if (data.ok) {
          showLogin();
        } else {
          document.getElementById('fail-reason').textContent =
            data.reason || 'الخادم لا يستجيب، قد يكون في وضع الاستعداد';
          setState('failed');
        }
      } catch (e) {
        document.getElementById('fail-reason').textContent =
          'تعذّر الوصول إلى الخادم — تحقق من الاتصال بالإنترنت';
        setState('failed');
      }
    }

    {% if error %}
    // Login already attempted and returned an error — skip connection check
    showLogin();
    {% else %}
    // Start connection check on page load
    startCheck();
    {% endif %}
  </script>
</body>
</html>
