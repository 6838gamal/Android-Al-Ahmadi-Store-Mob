version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./android_alahmadi.db:/app/android_alahmadi.db
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./android_alahmadi.db}
      - SECRET_KEY=${SECRET_KEY:-android-alahmadi-secret-key-2026}
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
      - ./android_alahmadi.db:/app/android_alahmadi.db
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./android_alahmadi.db}
      - SECRET_KEY=${SECRET_KEY:-android-alahmadi-secret-key-2026}
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5000:5000"
    depends_on:
      - backend
    restart: unless-stopped
