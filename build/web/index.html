<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="اندرويد الاحمدي - متجر الجوالات وقطع الغيار">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="اندرويد الاحمدي">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>اندرويد الاحمدي</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Aggressively unregister all service workers and clear caches
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        registrations.forEach(function(reg) { reg.unregister(); });
      });
      caches.keys().then(function(cacheNames) {
        cacheNames.forEach(function(name) { caches.delete(name); });
      });
    }

    // Auto-complete onboarding so users go straight to the welcome/login page.
    // shared_preferences on Flutter Web stores keys under the "flutter." prefix.
    try {
      localStorage.setItem('flutter.onboarding_done', 'true');
    } catch(e) {}
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
