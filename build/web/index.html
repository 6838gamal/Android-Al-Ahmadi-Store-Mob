<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="اندرويد الاحمدي - متجر الجوالات وقطع الغيار">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="اندرويد الاحمدي">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>اندرويد الاحمدي</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Unregister stale service workers so new builds load immediately
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let reg of registrations) { reg.unregister(); }
      });
    }
  </script>

  <!-- Firebase SDK (compat for phone auth + reCAPTCHA) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script>
    // ── reCAPTCHA container (invisible, required by Firebase phone auth) ──
    // Must exist in DOM before initializeApp
    document.addEventListener('DOMContentLoaded', function() {
      if (!document.getElementById('recaptcha-container')) {
        var div = document.createElement('div');
        div.id = 'recaptcha-container';
        div.style.position = 'fixed';
        div.style.bottom = '0';
        div.style.right = '0';
        div.style.zIndex = '9999';
        document.body.appendChild(div);
      }
    });

    // ── Firebase config (keys injected from env via server.js /firebase-config) ──
    let _firebaseApp = null;
    let _auth = null;
    let _confirmationResult = null;
    let _recaptchaVerifier = null;

    window.firebasePhoneAuth = {

      // Step 1: called from Flutter — initialise Firebase with config from backend
      init: async function(config) {
        try {
          if (!_firebaseApp) {
            _firebaseApp = firebase.initializeApp(config);
          }
          _auth = firebase.auth(_firebaseApp);
          // For testing: _auth.settings.appVerificationDisabledForTesting = true;
          return { ok: true };
        } catch(e) {
          return { ok: false, error: e.message };
        }
      },

      // Step 2: send OTP — creates invisible reCAPTCHA then calls signInWithPhoneNumber
      sendOtp: async function(phoneNumber) {
        try {
          if (!_auth) return { ok: false, error: 'Firebase not initialized' };

          // Destroy old verifier to allow re-sending
          if (_recaptchaVerifier) {
            try { _recaptchaVerifier.clear(); } catch(_) {}
            _recaptchaVerifier = null;
          }

          // Ensure container exists
          if (!document.getElementById('recaptcha-container')) {
            var div = document.createElement('div');
            div.id = 'recaptcha-container';
            div.style.position = 'fixed';
            div.style.bottom = '0';
            div.style.right = '0';
            div.style.zIndex = '9999';
            document.body.appendChild(div);
          }

          _recaptchaVerifier = new firebase.auth.RecaptchaVerifier(
            'recaptcha-container',
            { size: 'invisible' }
          );
          _confirmationResult = await _auth.signInWithPhoneNumber(
            phoneNumber, _recaptchaVerifier
          );
          return { ok: true };
        } catch(e) {
          return { ok: false, error: e.message };
        }
      },

      // Step 3: verify OTP code — returns Firebase ID token on success
      verifyOtp: async function(code) {
        try {
          if (!_confirmationResult) return { ok: false, error: 'No pending verification' };
          const credential = await _confirmationResult.confirm(code);
          const idToken = await credential.user.getIdToken();
          return { ok: true, idToken: idToken, phone: credential.user.phoneNumber };
        } catch(e) {
          return { ok: false, error: 'الرمز غير صحيح أو انتهت صلاحيته' };
        }
      },

      // Utility: sign out of Firebase (keep app session)
      signOut: async function() {
        try { if (_auth) await _auth.signOut(); } catch(_) {}
      }
    };
  </script>
</head>
<body>
  <div id="recaptcha-container" style="position:fixed;bottom:0;right:0;z-index:9999"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
