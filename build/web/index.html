<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="اندرويد الاحمدي - متجر الجوالات وقطع الغيار">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="اندرويد الاحمدي">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>اندرويد الاحمدي</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Unregister stale service workers so new builds load immediately
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let reg of registrations) { reg.unregister(); }
      });
    }
  </script>

  <!-- ── Firebase Phone Auth Bridge ──────────────────────────────────────── -->
  <script type="module">
    import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber }
      from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

    window.firebasePhoneAuth = {
      _auth: null,
      _recaptchaVerifier: null,
      _confirmationResult: null,

      init: async function(config) {
        try {
          if (!config.apiKey) return { ok: false, error: 'Firebase API key not configured' };
          const app = getApps().length ? getApps()[0] : initializeApp(config);
          this._auth = getAuth(app);
          this._auth.languageCode = 'ar';
          return { ok: true };
        } catch(e) {
          console.error('[Firebase] init error:', e);
          return { ok: false, error: String(e) };
        }
      },

      sendOtp: async function(phone) {
        try {
          // Remove old reCAPTCHA container if it exists
          const old = document.getElementById('fb-recaptcha');
          if (old) old.remove();
          if (this._recaptchaVerifier) {
            try { this._recaptchaVerifier.clear(); } catch(_) {}
            this._recaptchaVerifier = null;
          }

          // Create a fresh invisible reCAPTCHA container
          const div = document.createElement('div');
          div.id = 'fb-recaptcha';
          div.style.cssText = 'position:fixed;bottom:0;right:0;z-index:-1;opacity:0;';
          document.body.appendChild(div);

          this._recaptchaVerifier = new RecaptchaVerifier(this._auth, 'fb-recaptcha', {
            size: 'invisible',
            callback: () => {},
            'expired-callback': () => {}
          });

          this._confirmationResult = await signInWithPhoneNumber(
            this._auth, phone, this._recaptchaVerifier
          );
          console.log('[Firebase] OTP sent to', phone);
          return { ok: true };
        } catch(e) {
          console.error('[Firebase] sendOtp error:', e);
          return { ok: false, error: String(e) };
        }
      },

      verifyOtp: async function(code) {
        try {
          if (!this._confirmationResult) {
            return { ok: false, error: 'لم يُرسَل رمز تحقق بعد' };
          }
          const result = await this._confirmationResult.confirm(code);
          const idToken = await result.user.getIdToken();
          const phone = result.user.phoneNumber;
          console.log('[Firebase] OTP verified, phone:', phone);
          return { ok: true, idToken: idToken, phone: phone };
        } catch(e) {
          console.error('[Firebase] verifyOtp error:', e);
          return { ok: false, error: String(e) };
        }
      }
    };

    console.log('[Firebase] Phone auth bridge ready');
  </script>
  <!-- ───────────────────────────────────────────────────────────────────── -->
  <style>
    #conn-overlay {
      position: fixed; inset: 0; z-index: 99999;
      background: linear-gradient(160deg, #0d1117 0%, #111827 60%, #0f1923 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: 'Cairo', 'Segoe UI', sans-serif;
      direction: rtl;
      transition: opacity 0.5s ease;
    }
    #conn-overlay.hiding { opacity: 0; pointer-events: none; }

    .conn-logo {
      width: 110px; height: 110px;
      background: linear-gradient(135deg, #2196f3 0%, #0d47a1 100%);
      border-radius: 28px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 50px rgba(33,150,243,0.35);
      margin-bottom: 28px;
      animation: logoPop 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    .conn-logo svg { width: 58px; height: 58px; fill: white; }

    .conn-title {
      font-size: 28px; font-weight: 700; color: #fff;
      margin-bottom: 6px; letter-spacing: 0.5px;
      animation: fadeUp 0.5s 0.25s ease both;
    }
    .conn-sub {
      font-size: 13px; color: #6b7280;
      margin-bottom: 52px;
      animation: fadeUp 0.5s 0.4s ease both;
    }

    /* ── Status area ── */
    #conn-status {
      min-height: 100px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      animation: fadeUp 0.4s 0.7s ease both;
    }

    .spinner {
      width: 30px; height: 30px;
      border: 3px solid rgba(33,150,243,0.2);
      border-top-color: #2196f3;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }

    .conn-label {
      font-size: 14px; font-weight: 600; color: #9ca3af;
      margin-bottom: 5px;
    }
    .conn-attempt { font-size: 12px; color: #4b5563; }

    .conn-success {
      display: flex; flex-direction: column; align-items: center;
    }
    .conn-success .check-circle {
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(34,197,94,0.12);
      border: 2px solid rgba(34,197,94,0.4);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 12px;
      animation: logoPop 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    .conn-success .check-circle svg { width: 24px; height: 24px; stroke: #22c55e; fill: none; stroke-width: 3; }
    .conn-success .ok-label {
      font-size: 14px; font-weight: 700; color: #22c55e;
    }

    .conn-error {
      display: flex; flex-direction: column; align-items: center;
      max-width: 300px;
    }
    .conn-error .err-box {
      background: rgba(239,68,68,0.07);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 16px;
      padding: 18px 22px;
      text-align: center;
      margin-bottom: 16px;
    }
    .conn-error .err-icon { font-size: 28px; margin-bottom: 8px; }
    .conn-error .err-title { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .conn-error .err-hint { font-size: 12px; color: #6b7280; line-height: 1.6; }
    .retry-btn {
      background: linear-gradient(135deg, #2196f3, #1565c0);
      color: white; border: none; border-radius: 14px;
      padding: 12px 28px; font-size: 14px; font-weight: 700;
      font-family: inherit; cursor: pointer; direction: rtl;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 15px rgba(33,150,243,0.3);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .retry-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(33,150,243,0.4); }
    .retry-btn:active { transform: translateY(0); }

    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes logoPop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes fadeUp  { from { transform: translateY(14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
</head>
<body>

  <!-- ── Connection check overlay (removed once backend is ready) ── -->
  <div id="conn-overlay">
    <div class="conn-logo">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M17 1.01L7 1C5.9 1 5 1.9 5 3v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>
      </svg>
    </div>
    <div class="conn-title">اندرويد الاحمدي</div>
    <div class="conn-sub">متخصصون في الجوالات وقطع الغيار</div>
    <div id="conn-status"></div>
  </div>

  <script>
  (function() {
    var MAX_ATTEMPTS = 25;
    var RETRY_DELAY  = 3000;
    var attempt      = 0;
    var timer        = null;
    var flutterStarted = false;
    var statusEl     = document.getElementById('conn-status');
    var overlay      = document.getElementById('conn-overlay');

    function showConnecting() {
      var attemptHtml = attempt > 1
        ? '<div class="conn-attempt">المحاولة ' + attempt + ' من ' + MAX_ATTEMPTS + '</div>'
        : '';
      statusEl.innerHTML =
        '<div class="spinner"></div>' +
        '<div class="conn-label">جاري الاتصال بالخادم...</div>' +
        attemptHtml;
    }

    function showSuccess() {
      statusEl.innerHTML =
        '<div class="conn-success">' +
          '<div class="check-circle">' +
            '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>' +
          '</div>' +
          '<div class="ok-label">تم الاتصال بنجاح ✓</div>' +
        '</div>';
    }

    function showFailed() {
      statusEl.innerHTML =
        '<div class="conn-error">' +
          '<div class="err-box">' +
            '<div class="err-icon">📡</div>' +
            '<div class="err-title">تعذّر الاتصال بالخادم</div>' +
            '<div class="err-hint">تحقق من اتصالك بالإنترنت<br>أو حاول مرة أخرى</div>' +
          '</div>' +
          '<button class="retry-btn" onclick="window._connRetry()">↺ إعادة المحاولة</button>' +
        '</div>';
    }

    function startFlutter() {
      if (flutterStarted) return;
      flutterStarted = true;
      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js';
      s.async = true;
      document.body.appendChild(s);
    }

    function hideOverlay() {
      overlay.classList.add('hiding');
      setTimeout(function() {
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      }, 550);
    }

    function check() {
      attempt++;
      showConnecting();

      fetch('/api/health', { method: 'GET', cache: 'no-store' })
        .then(function(r) {
          if (r.ok || r.status === 200) {
            showSuccess();
            startFlutter();
            setTimeout(hideOverlay, 700);
          } else {
            retry();
          }
        })
        .catch(function() {
          if (attempt >= MAX_ATTEMPTS) {
            showFailed();
          } else {
            timer = setTimeout(check, RETRY_DELAY);
          }
        });
    }

    window._connRetry = function() {
      attempt = 0;
      if (timer) clearTimeout(timer);
      check();
    };

    // Start after a short delay to let logo animate
    setTimeout(check, 800);
  })();
  </script>

</body>
</html>
