services:
  - type: web
    name: android-al-ahmadi-store-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_backend.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: android-al-ahmadi-store-api
          property: host
    healthCheckPath: /api/health
